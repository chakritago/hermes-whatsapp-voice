<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1220">
<title>Hermes · Voice</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf1fa;background:#0b1220}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -15%,#233957 0%,#0b1220 50%)}
.shell{max-width:560px;margin:0 auto;padding:28px 20px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;background:#223f65;color:#80d7ff;border:1px solid #345c86;border-radius:18px;height:52px;width:52px;font-size:26px}
h1{font-size:23px;margin:0;letter-spacing:-.5px}
header p{margin:3px 0 0;color:#9fb1c9;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #36536a;border-radius:30px;background:#132339;color:#c7d9e9;font-size:13px}
.dot{height:8px;width:8px;border-radius:50%;background:#8095a8}
.pill.live .dot{background:#40e0a4;box-shadow:0 0 12px #40e0a4}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:44px 0 24px}
.orb-wrap{width:214px;height:214px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#184977 0%,#112e53 52%,transparent 70%);position:relative}
.orb-wrap:before{content:"";position:absolute;inset:12px;border:1px solid #4674a477;border-radius:50%}
.orb{height:122px;width:122px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#6fd8ff,#295ebf);box-shadow:0 0 40px #388fc766;color:#fff;font-size:55px}
.orb-wrap.active .orb{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 65px #3ca6ff99}}
h2{margin:0;font-size:22px;letter-spacing:-.35px}
.description{margin:0;color:#aabbd0;text-align:center;line-height:1.6;font-size:15px;max-width:320px}
.actions{width:100%;display:flex;gap:12px}
button{border:0;border-radius:16px;padding:16px 22px;font-size:16px;font-weight:650;cursor:pointer;flex:1;transition:transform .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
#start{background:#55bff7;color:#09203a}
#end{background:#29364b;color:#eff5fc;border:1px solid #4b5c70;max-width:105px}
.conversation{width:100%;border:1px solid #2a3f5a;background:#111d30;border-radius:20px;padding:18px;margin-top:16px;min-height:150px}
.conversation h3{font-size:14px;margin:0 0 12px;color:#cbdcf1}
#transcript{display:flex;flex-direction:column;gap:12px;max-height:200px;overflow:auto;min-height:60px}
.message{border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.message.user{align-self:flex-end;background:#244c70;max-width:85%}
.message.assistant{align-self:flex-start;background:#28364d;max-width:85%}
.empty{color:#91a3bd;font-size:13px;margin:4px 0}
footer{text-align:center;color:#8397af;font-size:12px;line-height:1.5;margin-top:16px}
@media(prefers-reduced-motion:reduce){.orb-wrap.active .orb{animation:none}}

.orb-wrap{width:174px;height:174px;margin-bottom:0;transition:transform .2s}
.orb{width:108px;height:108px;border:1px solid #a1f0ff99}
.avatar-face{width:58px;height:48px;border-radius:48% 48% 42% 42%;background:#113a76;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid #b4f1ff;box-shadow:inset 0 0 16px #75e3ff66}
.avatar-eye{width:9px;height:13px;border-radius:12px;background:#b5f9ff;box-shadow:0 0 10px #9df7ff}
#visualizer{flex:none;min-height:116px;width:min(100%,390px);padding:9px 8px;background:#101e32;color:#b9d8ee;border:1px solid #284565;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:1px}
#visualizer canvas{display:block;width:100%;max-width:360px;height:84px}
#visualizer span{font-size:11px;color:#94aac4}
.controls{display:flex;gap:10px;flex-wrap:wrap;width:100%;align-items:center}
.controls button{flex:0 0 auto;background:#233c55;color:#e5f3fc;font-size:14px;min-height:46px;padding:10px 14px}
.controls button.muted{background:#603d4b;color:#ffe0e0}
.controls label{min-width:0;flex:1;font-size:13px;color:#a6bdd6;display:flex;gap:8px;align-items:center}
.controls label[hidden]{display:none}
.controls select{flex:1;min-width:0;width:100%;max-width:275px;padding:12px 8px;border-radius:12px;background:#1a3049;color:#e1f4ff;border:1px solid #3b668c;font-size:13px}
#reconnectInfo{min-height:18px;color:#8acdf5;font-size:13px;margin:0;text-align:center}
.pill[data-phase="reconnecting"] .dot{background:#e7c56a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.pill[data-phase="reconnecting"] .dot{animation:none}}
@media(max-width:380px){.shell{padding:16px 12px 24px}main{gap:12px;padding:18px 0}.orb-wrap{width:144px;height:144px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="logo" aria-hidden="true">✦</div><div><h1>Hermes Voice</h1><p>Telegram Mini App · Gemini Live</p></div></header>
<main>
<div id="status" class="pill" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">พร้อมเริ่มสนทนา</span></div>
<div id="orb" class="orb-wrap">
  <div class="orb" aria-label="Hermes Avatar"><div class="avatar-face" aria-hidden="true"><span class="avatar-eye"></span><span class="avatar-eye"></span></div></div>
</div>
<button type="button" id="visualizer" aria-label="แสดงคลื่นเสียงแบบแท่ง กดเพื่อเปลี่ยน">
  <canvas id="waveform" width="360" height="84" aria-hidden="true"></canvas>
  <span>แตะเพื่อสลับรูปแบบคลื่นเสียง</span>
</button>
<div style="text-align:center"><h2>คุยกับ Hermes</h2><p class="description" id="description">สนทนาด้วยเสียงแบบเรียลไทม์ ถามคำถามหรือสั่งงาน Hermes ได้โดยตรง</p></div>
<div class="actions"><button type="button" id="start">🎙 เริ่มสนทนา</button><button type="button" id="end" disabled>วางสาย</button></div>
<div class="controls">
  <button type="button" id="mute" disabled aria-pressed="false">🎙 ปิดไมค์</button>
  <label id="outputRow" hidden>ลำโพง <select id="outputSelect" aria-label="เลือกอุปกรณ์เสียง"><option value="default">ลำโพงเริ่มต้น</option></select></label>
</div>
<p id="reconnectInfo" role="status" aria-live="polite"></p>
<audio id="speakerAudio" autoplay playsinline hidden></audio>
<section class="conversation" aria-label="บทสนทนา"><h3>บทสนทนา</h3><div id="transcript" aria-live="polite"><p class="empty">ข้อความจากบทสนทนาจะปรากฏที่นี่</p></div></section>
</main><footer>เข้ารหัสด้วย HTTPS/WSS · ไมโครโฟนใช้งานเฉพาะระหว่างสนทนา</footer>
</div>
<script src="/app.js" defer></script>
</body>
</html>
