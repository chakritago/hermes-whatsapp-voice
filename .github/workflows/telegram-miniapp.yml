name: telegram-miniapp

on:
  push:
    branches: [main, feat/telegram-miniapp-live-voice]
  pull_request:

permissions:
  contents: read

jobs:
  telegram:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py
      - run: ruff check telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py
      - run: ruff format --check telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py
      - run: python -m pytest tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py -q
      - run: node --check telegram_miniapp/web/app.js
      - run: node --check telegram_miniapp/web/audio-worklet.js
      - run: node tests/test_audio_worklet.cjs
      - run: python -m compileall -q telegram_miniapp
