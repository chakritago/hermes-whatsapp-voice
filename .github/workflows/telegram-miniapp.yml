name: telegram-miniapp

on:
  push:
    branches: [main, feat/telegram-miniapp-live-voice]
  pull_request:

permissions:
  contents: read

jobs:
  telegram:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py tests/test_tool_approval.py tests/test_external_monitor.py tests/test_r5_policies.py tests/test_r6_reliability.py
      - run: ruff check telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py tests/test_tool_approval.py tests/test_external_monitor.py tests/test_r5_policies.py tests/test_r6_reliability.py
      - run: ruff format --check telegram_miniapp tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py tests/test_tool_approval.py tests/test_external_monitor.py tests/test_r5_policies.py tests/test_r6_reliability.py
      - run: python -m pytest tests/test_telegram_miniapp.py tests/test_gateway_operations.py tests/test_voice_bridge_e2e.py tests/test_tool_approval.py tests/test_external_monitor.py tests/test_r5_policies.py tests/test_r6_reliability.py -q
      - run: node --check telegram_miniapp/web/app.js
      - run: node --check telegram_miniapp/web/audio-worklet.js
      - run: node tests/test_audio_worklet.cjs
      - run: node --check telegram_miniapp/web/audio-buffer.js
      - run: node tests/test_adaptive_buffer.cjs
      - run: node tests/test_dashboard.cjs
      - run: node tests/test_webview_accessibility.cjs
      - run: python -m compileall -q telegram_miniapp
      - name: Simulated Windows Service Release Gate (no service or OS reboot)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_windows_release_sim.ps1
      - name: Import real Windows Service host
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r telegram_miniapp/requirements-windows.txt
          python -c "from telegram_miniapp.windows_service import HermesTelegramService; assert HermesTelegramService._svc_name_ == 'HermesTelegramVoice'"
      - name: Validate Windows PowerShell installation scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('telegram_miniapp/install_windows_service.ps1','telegram_miniapp/start_windows.ps1','telegram_miniapp/release_gate_windows.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Invalid PowerShell script: $file" }
          }
